# Netlify configuration file
[build]
  command = "npm run build"
  publish = ".next"

# Environment variables needed for build
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # Secrets scanning stays enabled. Only the public Google Maps keys are
  # exempt: they are NEXT_PUBLIC_* values inlined into the client bundle by design.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_MAP_ID"
  # Smart detection flags the inlined public Maps key ("AIza...") by value,
  # so it is off; the env-var based scan above still runs for every other secret.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Ensure Next.js is properly handled
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify Image CDN allowlist — /_next/image is redirected to
# /.netlify/images below, and the Image CDN rejects any remote host not
# matching these regexes ("url ... is not an allowed pattern").
# Keep in sync with images.remotePatterns in next.config.ts.
[images]
  remote_images = [
    "https://testapi\\.artlighthouse\\.ge/.*",
    "https://art-light-house-images\\.fra1\\.cdn\\.digitaloceanspaces\\.com/.*",
    "https://echodesk-spaces\\.fra1\\.digitaloceanspaces\\.com/.*",
    "https://echodesk-media\\.fsn1\\.your-objectstorage\\.com/.*",
  ]

# Headers for proper caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts in public/fonts are not content-hashed: if a font file is ever
# replaced, give it a new filename (browsers keep the old one up to a year).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers (no full CSP: only frame-ancestors, so scripts, styles
# and Google Maps are unaffected). No Cache-Control here, so the caching
# rules above are unchanged.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# Redirect handling for images
[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }

[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }
